<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mezzi di Soccorso</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- App Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Removed -->

        <!-- Main Content -->
        <main class="main-content">
            <!-- Simplified Control Bar -->
            <!-- Simplified Control Bar -->
            <div class="header-container">
                <div class="header-row-title">
                    <h1>GESTIONE AUTOMEZZI 118 FERRARA</h1>
                </div>


                <div class="header-row-controls">
                    <div class="action-buttons">
                        <button class="btn btn-primary admin-only" id="add-vehicle-btn">
                            <i class="fa-solid fa-plus"></i> Nuovo Mezzo
                        </button>
                        <button class="btn admin-only" id="btn-manage-data" onclick="openDataManagement()"
                            style="background: var(--secondary-color); color: white;" title="Gestione Dati Database">
                            <i class="fa-solid fa-database"></i> VIEW DB
                        </button>
                        <button class="btn" id="admin-login-btn" onclick="toggleAdminMode()"
                            style="background: white; border: 1px solid var(--border-color); color: var(--text-secondary);"
                            title="Admin Login">
                            <i class="fa-solid fa-lock" id="admin-lock-icon"></i>
                        </button>
                        <span id="admin-hint-text"
                            style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; white-space: nowrap;">
                            Modalita visualizzazione,
                        </span>
                    </div>
                </div>
            </div>

            <!-- Dashboard View -->
            <div id="dashboard-view" class="view active">
                <!-- Title removed from here -->

                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card operative">
                        <div class="stat-icon"><i class="fa-solid fa-check-circle"></i></div>
                        <div class="stat-info">
                            <h3>In Servizio</h3>
                            <p class="stat-value" id="stat-operative">0</p>
                        </div>
                    </div>
                    <div class="stat-card available">
                        <div class="stat-icon"><i class="fa-solid fa-user-check"></i></div>
                        <div class="stat-info">
                            <h3>Disponibile</h3>
                            <p class="stat-value" id="stat-available">0</p>
                        </div>
                    </div>
                    <div class="stat-card maintenance">
                        <div class="stat-icon"><i class="fa-solid fa-screwdriver-wrench"></i></div>
                        <div class="stat-info">
                            <h3>In Officina</h3>
                            <p class="stat-value" id="stat-maintenance">0</p>
                        </div>
                    </div>
                    <div class="stat-card to-repair">
                        <div class="stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        <div class="stat-info">
                            <h3>Da Riparare</h3>
                            <p class="stat-value" id="stat-to-repair">0</p>
                        </div>
                    </div>
                </div>

                <!-- Recent Activity / Vehicle List -->
                <div class="section-header">
                    <h3>Veicoli in Gestione</h3>
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">Tutti</button>
                        <button class="filter-btn" data-filter="operative">In Servizio</button>
                        <button class="filter-btn" data-filter="available">Disponibile</button>
                        <button class="filter-btn" data-filter="maintenance">In Officina</button>
                        <button class="filter-btn" data-filter="to-repair">Da Riparare</button>
                    </div>
                </div>

                <div class="vehicle-grid" id="vehicle-grid">
                    <!-- Vehicle cards will be injected here -->
                </div>
            </div>

            <!-- Vehicle Details Modal -->
            <div id="vehicle-modal" class="modal hidden">
                <div class="modal-content">
                    <span class="close-modal">&times;</span>
                    <div class="vehicle-details-container" id="vehicle-details-content">
                        <!-- Details injected via JS -->
                    </div>
                </div>
            </div>

            <!-- Add/Edit Vehicle Modal -->
            <div id="vehicle-form-modal" class="modal hidden">
                <div class="modal-content" style="max-width: 600px; height: auto; max-height: 90vh;">
                    <div
                        style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                        <h3 id="form-modal-title" style="font-size: 1.25rem; font-weight: 600;">Aggiungi Nuovo Mezzo
                        </h3>
                        <span class="close-form-modal"
                            style="font-size: 1.5rem; cursor: pointer; color: var(--text-secondary);">&times;</span>
                    </div>
                    <div style="padding: 1.5rem;">
                        <form id="vehicle-form">
                            <input type="hidden" id="vehicle-id">

                            <div class="form-grid-2">
                                <div class="form-group" style="margin-bottom: 1rem;">
                                    <label
                                        style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Modello</label>
                                    <input type="text" id="vehicle-model" required
                                        style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                                </div>
                                <div class="form-group" style="margin-bottom: 1rem;">
                                    <label
                                        style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Targa</label>
                                    <input type="text" id="vehicle-plate" required
                                        style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                                </div>
                                <div class="form-group" style="margin-bottom: 1rem;">
                                    <label
                                        style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Sigla
                                        Mezzo</label>
                                    <input type="text" id="vehicle-sigla"
                                        style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                                </div>
                            </div>

                            <div class="form-grid-2">
                                <!-- Vehicle Type removed as per request -->
                                <div class="form-group" style="margin-bottom: 1rem;">
                                    <label
                                        style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Stato</label>
                                    <select id="vehicle-status"
                                        style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                                        <option value="operative">Operativa</option>
                                        <option value="available">Disponibile</option>
                                        <option value="maintenance">In Officina</option>
                                        <option value="to-repair">Da Riparare</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-grid-3">
                                <div class="form-group" style="margin-bottom: 1rem;">
                                    <div
                                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                                        <label style="font-weight: 500; font-size: 0.9rem;">Stazione</label>
                                        <button type="button"
                                            style="background: none; border: none; color: var(--primary-color); font-size: 0.8rem; cursor: pointer; font-weight: 500;"
                                            onclick="window.openLocationModal()">
                                            <i class="fa-solid fa-gear"></i> Gestisci
                                        </button>
                                    </div>
                                    <select id="vehicle-station" required
                                        style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                                        <!-- Options populated via JS -->
                                    </select>
                                </div>
                                <div class="form-group" style="margin-bottom: 1rem;">
                                    <label
                                        style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Chilometri</label>
                                    <input type="number" id="vehicle-mileage" required
                                        style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                                </div>
                                <div class="form-group" style="margin-bottom: 1rem;">
                                    <label
                                        style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Mese
                                        Rif.</label>
                                    <input type="text" id="vehicle-mileage-month" placeholder="Es. Gennaio"
                                        style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                                </div>
                            </div>

                            <!-- Extended Details: Equipment -->
                            <div
                                style="background: #f8fafc; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem;">
                                <h4
                                    style="font-size: 0.9rem; font-weight: 600; margin-bottom: 0.8rem; color: var(--text-secondary);">
                                    Dotazioni</h4>
                                <div class="form-grid-3 small-gap">
                                    <div class="form-group">
                                        <label
                                            style="display: block; margin-bottom: 0.3rem; font-size: 0.8rem;">Barella</label>
                                        <input type="text" id="vehicle-barella" placeholder="Modello/ID"
                                            style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 0.4rem; font-size: 0.9rem;">
                                    </div>
                                    <div class="form-group">
                                        <label style="display: block; margin-bottom: 0.3rem; font-size: 0.8rem;">ID
                                            Radio</label>
                                        <input type="text" id="vehicle-radio" placeholder="ID Univoco"
                                            style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 0.4rem; font-size: 0.9rem;">
                                    </div>
                                    <div class="form-group">
                                        <label style="display: block; margin-bottom: 0.3rem; font-size: 0.8rem;">ID
                                            Aspiratore</label>
                                        <input type="text" id="vehicle-aspirator" placeholder="ID Univoco"
                                            style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 0.4rem; font-size: 0.9rem;">
                                    </div>
                                </div>
                            </div>

                            <!-- Extended Details: Dates -->
                            <div
                                style="background: #f8fafc; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem;">
                                <h4
                                    style="font-size: 0.9rem; font-weight: 600; margin-bottom: 0.8rem; color: var(--text-secondary);">
                                    Scadenze</h4>
                                <div class="form-grid-2">
                                    <div class="form-group">
                                        <label
                                            style="display: block; margin-bottom: 0.3rem; font-size: 0.8rem;">Scadenza
                                            Revisione</label>
                                        <input type="date" id="vehicle-inspection"
                                            style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 0.4rem; font-size: 0.9rem;">
                                    </div>
                                    <div class="form-group">
                                        <label
                                            style="display: block; margin-bottom: 0.3rem; font-size: 0.8rem;">Prossimo
                                            Collaudo</label>
                                        <input type="date" id="vehicle-testing"
                                            style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 0.4rem; font-size: 0.9rem;">
                                    </div>
                                </div>
                            </div>

                            <!-- Notes -->
                            <div class="form-group" style="margin-bottom: 1.5rem;">
                                <label
                                    style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Note
                                    Generiche</label>
                                <textarea id="vehicle-notes" rows="2" placeholder="Informazioni aggiuntive..."
                                    style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem; font-family: inherit;"></textarea>
                            </div>

                            <div class="form-group" style="margin-bottom: 1.5rem;">
                                <label
                                    style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Foto
                                    del Mezzo</label>
                                <div style="display: flex; gap: 0.5rem; flex-direction: column;">
                                    <input type="file" id="vehicle-image-upload" accept="image/*"
                                        style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                                    <input type="hidden" id="vehicle-image">
                                </div>
                            </div>

                            <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                                <button type="button" class="btn"
                                    style="background: white; border: 1px solid var(--border-color);"
                                    id="cancel-vehicle-btn">Annulla</button>
                                <button type="submit" class="btn btn-primary">Salva Mezzo</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Maintenance Record Modal -->
            <div id="maintenance-form-modal" class="modal hidden">
                <div class="modal-content" style="max-width: 500px; height: auto;">
                    <div
                        style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                        <h3 style="font-size: 1.25rem; font-weight: 600;">Aggiungi Record Manutenzione</h3>
                        <span class="close-maintenance-modal"
                            style="font-size: 1.5rem; cursor: pointer; color: var(--text-secondary);">&times;</span>
                    </div>
                    <div style="padding: 1.5rem;">
                        <form id="maintenance-form">
                            <input type="hidden" id="maintenance-vehicle-id">
                            <input type="hidden" id="maintenance-id">

                            <div class="form-group" style="margin-bottom: 1rem;">
                                <label
                                    style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Sigla
                                    Mezzo</label>
                                <input type="text" id="maintenance-vehicle-sigla" readonly
                                    style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem; background-color: #f1f5f9; color: var(--text-secondary); font-weight: 600;">
                            </div>

                            <div class="form-grid-2 mb-1">
                                <div class="form-group">
                                    <label
                                        style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Data
                                        Entrata</label>
                                    <input type="date" id="maintenance-date" required
                                        style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                                </div>
                                <div class="form-group">
                                    <label
                                        style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Data
                                        Uscita</label>
                                    <input type="date" id="maintenance-date-out"
                                        style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                                </div>
                            </div>

                            <div class="form-group" style="margin-bottom: 1.5rem;">
                                <label
                                    style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Descrizione
                                    Intervento</label>
                                <textarea id="maintenance-description" required rows="3"
                                    placeholder="Descrizione dettagliata..."
                                    style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem; font-family: inherit;"></textarea>
                            </div>

                            <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                                <button type="button" class="btn"
                                    style="background: white; border: 1px solid var(--border-color);"
                                    id="cancel-maintenance-btn">Annulla</button>
                                <button type="submit" class="btn btn-primary">Salva Record</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <!-- Location Management Modal -->
        <div id="location-modal" class="modal hidden">
            <div class="modal-content" style="max-width: 500px; height: auto; max-height: 80vh;">
                <div
                    style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                    <h2 id="location-modal-title" style="font-size: 1.5rem; font-weight: 700;">Gestisci Luoghi</h2>
                    <div class="close-location-modal"
                        style="cursor: pointer; font-size: 1.5rem; color: var(--text-secondary);">&times;</div>
                </div>
                <div style="padding: 1.5rem;">
                    <form id="add-location-form" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
                        <input type="text" id="new-location-input" placeholder="Nuovo Luogo..." required
                            style="flex-grow: 1; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-plus"></i> Aggiungi
                        </button>
                    </form>

                    <div style="max-height: 300px; overflow-y: auto;">
                        <ul id="location-list" style="list-style: none; padding: 0;">
                            <!-- Locations Rendered Here -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Data Management Modal -->
        <div id="data-management-modal" class="modal hidden">
            <div class="modal-content"
                style="max-width: 900px; height: 85vh; display: flex; flex-direction: column; resize: horizontal; overflow: auto; min-width: 600px; min-height: 400px;">
                <div
                    style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="font-size: 1.5rem; font-weight: 700;">Gestione Database</h2>
                    <button onclick="document.getElementById('data-management-modal').classList.add('hidden')"
                        style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
                </div>
                <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; gap: 1rem;">
                    <button class="filter-btn active" onclick="switchDataTable('vehicles')">Mezzi</button>
                    <button class="filter-btn" onclick="switchDataTable('locations')">Luoghi</button>
                    <button class="filter-btn" onclick="switchDataTable('interventions')">Interventi</button>
                </div>
                <div style="flex-grow: 1; overflow-y: auto; padding: 1.5rem;">
                    <div id="data-table-container">
                        <!-- Dynamic Table -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Admin Login Modal -->
        <div id="admin-login-modal" class="modal hidden">
            <div class="modal-content" style="max-width: 400px; height: auto;">
                <div
                    style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="font-size: 1.25rem; font-weight: 600;">Admin Login</h3>
                    <span onclick="document.getElementById('admin-login-modal').classList.add('hidden')"
                        style="font-size: 1.5rem; cursor: pointer;">&times;</span>
                </div>
                <div style="padding: 1.5rem;">
                    <form id="admin-login-form">
                        <div class="form-group" style="margin-bottom: 1rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
                            <input type="password" id="admin-password-input" required
                                style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Accedi</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="store.js"></script>
    <script src="app.js"></script>
</body>

</html>
